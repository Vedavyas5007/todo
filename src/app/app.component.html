    <div class="container">
        <div class="main">

            <h1>ToDo List</h1>
            <h2>Plan your task and achieve maximum productivity</h2>
            <input type="text" id="inp" (input)="addText($event)">

            <button (click)="addTask()">Add Task</button>
            
            <div id="tas" *ngFor="let task of tasks, let i = index">
                <div>
                    {{task}} 
                </div>
                <div>
                    <svg (click)="deleteTask(i)" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#4B77D1"><path d="m336-280 144-144 144 144 56-56-144-144 144-144-56-56-144 144-144-144-56 56 144 144-144 144 56 56ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg>
                    <svg (click)="moveTask(i)" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#4B77D1"><path d="m424-296 282-282-56-56-226 226-114-114-56 56 170 170Zm56 216q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg>
                </div>
            </div>
            <div>
                <img *ngIf="tasks.length==0" src="checklist.png" width="200px" alt="">
            </div>

            <h1 *ngIf="completed_tasks.length!=0">Completed Tasks</h1>
            <div *ngFor="let completed_task of completed_tasks">
                <div style="text-decoration: line-through;">
                    {{completed_task}}
                </div>
            </div>

            
        </div>

    </div>
